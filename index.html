<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños mi Amor 💌</title>
    <link rel="stylesheet" href="style.css">
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<body>

    <div class="container">

        <div class="hearts">
            <span>♥️</span>
            <span>♥️</span>
            <span>♥️</span>
        </div>


<div class="polaroids">

    <div class="polaroid p1">
        <img src="img/foto1.jpeg" alt="Foto 1">
    </div>

    <div class="polaroid p2">
        <img src="img/foto2.jpeg" alt="Foto 2">
    </div>

    <div class="polaroid p3">
        <img src="img/foto3.jpeg" alt="Foto 3">
    </div>

    <div class="polaroid p4">
        <img src="img/foto4.jpeg" alt="Foto 4">
    </div>

    <div class="polaroid p5">
        <img src="img/foto5.jpeg" alt="Foto 5">
    </div>

    <div class="polaroid p6">
        <img src="img/foto6.jpeg" alt="Foto 6">
    </div>

</div>


        <!-- SOBRE -->
        <div class="envelope" id="envelope">

            <div class="back"></div>

            <div class="letter" id="letter">
                <div class="letter-content">
                    <h2>Feliz Cumpleaños Mi Amor ❤️</h2>
                    <p id="message"></p>
                </div>
            </div>

            <div class="front"></div>

            <div class="flap"></div>

            <div class="heart">♥️</div>

        </div>

        <!-- BOTONES -->
        <div class="buttons">
            <button id="openBtn">OPEN</button>
            <button id="resetBtn">RESET</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
